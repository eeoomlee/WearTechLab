    <div id="specialPopup" class="popup-overlay" style="display: none;">

            <!-- 팝업 이미지 클릭 시 SAGE Special Collection 페이지로 이동 -->

               rel="noopener noreferrer"
               class="popup-image-link">

                     alt="Journal of Industrial Textiles Special Collection"
                     class="popup-image">

            </a>

            <!-- 팝업 하단 버튼 -->
            <div class="popup-buttons">

                <button type="button" onclick="hidePopupToday()">
                    오늘 하루 열지 않기
                </button>

                <span class="popup-divider">|</span>

                <button type="button"
                        onclick="document.getElementById('specialPopup').style.display='none';">
                    닫기
                </button>

    </div>

    <!-- =========================================
         Popup Script
    ========================================== -->
    <script>

        const popup = document.getElementById("specialPopup");


        /* 오늘 하루 열지 않기 */
        function hidePopupToday() {

            const now = new Date();

            const today =
                now.getFullYear() + "-" +
                String(now.getMonth() + 1).padStart(2, "0") + "-" +
                String(now.getDate()).padStart(2, "0");

            localStorage.setItem(
                "specialCollectionPopupDate",
                today
            );

            popup.style.display = "none";
        }


        /* 홈페이지 접속 시 팝업 표시 여부 확인 */
        window.addEventListener("DOMContentLoaded", function () {

            const now = new Date();

            const today =
                now.getFullYear() + "-" +
                String(now.getMonth() + 1).padStart(2, "0") + "-" +
                String(now.getDate()).padStart(2, "0");

            const hiddenDate =
                localStorage.getItem(
                    "specialCollectionPopupDate"
                );


            if (hiddenDate !== today) {
                popup.style.display = "flex";
            }

        });

    </script>

</body>
